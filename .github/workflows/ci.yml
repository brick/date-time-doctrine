name: CI

on:
  push:
  pull_request:

env:
  PHPSTAN_PHP_VERSION: "8.5"
  COVERAGE_PHP_VERSION: "8.5"

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHPSTAN_PHP_VERSION }}

      - name: Install composer dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPStan
        run: vendor/bin/phpstan --no-progress

  coding-standard:
    name: Coding Standard
    uses: brick/coding-standard/.github/workflows/coding-standard.yml@v5
    with:
      working-directory: "tools/ecs"

  brick-date-time-constraints:
    name: brick/date-time constraints
    runs-on: ubuntu-latest

    outputs:
      constraints: ${{ steps.constraints.outputs.constraints }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Split brick/date-time constraint from composer.json
        id: constraints
        run: echo "constraints=$(jq -c '.require["brick/date-time"] | [splits(" *\\|\\|? *")]' composer.json)" >> "$GITHUB_OUTPUT"

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    needs: brick-date-time-constraints

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        brick-date-time: ${{ fromJSON(needs.brick-date-time-constraints.outputs.constraints) }}
        deps:
          - "highest"
        include:
          - php-version: "8.2"
            deps: "lowest"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug

      - name: Restrict brick/date-time version
        run: composer require --no-update "brick/date-time:$BRICK_DATE_TIME_CONSTRAINT"
        env:
          BRICK_DATE_TIME_CONSTRAINT: ${{ matrix.brick-date-time }}
        if: ${{ matrix.brick-date-time }}

      - name: Install composer dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.deps }}

      - name: Run PHPUnit
        run: vendor/bin/phpunit
        if: ${{ matrix.php-version != env.COVERAGE_PHP_VERSION }}

      - name: Run PHPUnit with coverage
        run: vendor/bin/phpunit --coverage-clover clover.xml
        if: ${{ matrix.php-version == env.COVERAGE_PHP_VERSION }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: ${{ matrix.php-version == env.COVERAGE_PHP_VERSION }}
